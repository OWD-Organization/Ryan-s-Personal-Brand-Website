<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifestyle Audit | Ryan Kearney</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --terra: #C4785A;
    --terra-dark: #A85E42;
    --terra-bg: #f6e9e2;
    --cream: #FAF8F5;
    --cream-alt: #f1ede7;
    --ink: #1A1A1A;
    --charcoal: #2C2C2A;
    --charcoal-soft: #4a4a47;
    --card: #ffffff;
    --line: #e6e1d9;
    --line-strong: #d3cdc2;
    --text: #1A1A1A;
    --text-soft: #555555;
    --text-faint: #9c988f;
    --sage: #8FA67E;
    --ok: #64794f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    min-height: 100vh;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 34px 30px;
  }
  h1 { font-size: 34px; font-weight: 500; color: var(--ink); line-height: 1.15; letter-spacing: -0.02em; }
  h2 { font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.3; letter-spacing: -0.01em; }
  .muted { color: var(--text-soft); }
  .faint { color: var(--text-faint); }
  .small { font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--terra); color: var(--cream); border: none;
    font-size: 15px; font-weight: 600; letter-spacing: .5px; font-family: inherit;
    padding: 14px 28px; border-radius: 2px; cursor: pointer;
    transition: background .15s, transform .05s;
    text-decoration: none;
  }
  .btn:hover { background: var(--terra-dark); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: var(--line-strong); color: #fff; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--terra);
    border: 1.5px solid var(--terra); border-radius: 50px; padding: 12px 26px;
    font-weight: 500; letter-spacing: 0;
  }
  .btn-ghost:hover { background: var(--terra-bg); }
  .btn-ghost .arr { transition: transform .15s; }
  .btn-ghost:hover .arr { transform: translateX(3px); }
  .btn-dark {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 50px; padding: 12px 26px;
    font-weight: 500; letter-spacing: 0;
  }
  .btn-dark:hover { background: var(--cream-alt); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 12px;
  }
  .qcount {
    font-size: 13px; font-weight: 500; color: var(--text-soft);
    background: var(--cream-alt); padding: 6px 13px; border-radius: 20px;
    letter-spacing: .01em;
  }
  .timer {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 6px 13px; border-radius: 20px;
    background: var(--terra-bg); color: var(--terra-dark);
    transition: background .3s, color .3s;
  }
  .timer.grace { background: #f7ddd3; color: var(--terra-dark); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
  .timer-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .part-label {
    display: flex; align-items: center; gap: 9px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .14em; color: var(--text-soft); margin-bottom: 10px;
  }
  .part-label:before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--terra); flex-shrink: 0;
  }
  .part-label.done:before { background: var(--sage); }
  .qtext { font-size: 19px; font-weight: 500; color: var(--ink); margin-bottom: 14px; line-height: 1.4; }
  .qsub { font-size: 14px; color: var(--text-faint); margin: -8px 0 14px; }
  .block { margin-bottom: 26px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    border: 1px solid var(--line-strong); border-radius: 4px;
    padding: 13px 15px; font-size: 16px; font-family: inherit; line-height: 1.5;
    color: var(--text); background: #fdfcfa;
  }
  textarea:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px var(--terra-bg); }
  textarea:disabled { background: var(--cream-alt); color: var(--text-soft); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 14px; font-weight: 500; color: var(--text-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 4px;
    padding: 13px 15px; font-size: 16px; font-family: inherit;
    color: var(--text); background: #fdfcfa;
  }
  .field input:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px var(--terra-bg); }
  .warnmsg {
    display: none; align-items: center; gap: 8px;
    background: var(--terra-bg); color: var(--terra-dark);
    font-size: 14px; font-weight: 500;
    padding: 11px 15px; border-radius: 4px; margin-bottom: 18px;
  }
  .warnmsg.show { display: flex; }
  .footer-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .scale-def {
    display: flex; gap: 10px; background: var(--cream-alt); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 22px; font-size: 14px;
  }
  .scale-def div { flex: 1; }
  .scale-num { font-weight: 600; color: var(--terra); }
  .wheel-area { margin-bottom: 20px; }
  .wheel-area-name { font-size: 16px; font-weight: 500; margin-bottom: 9px; color: var(--text); }
  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num {
    flex: 1; min-width: 38px; height: 44px;
    border: 1px solid var(--line-strong); border-radius: 4px;
    background: #fdfcfa; color: var(--text); font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: all .12s;
  }
  .num:hover { border-color: var(--terra); }
  .num.sel { background: var(--terra); color: #fff; border-color: var(--terra); }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .choice {
    text-align: left; border: 1px solid var(--line-strong); border-radius: 4px;
    background: #fdfcfa; padding: 14px 16px; font-size: 16px; font-family: inherit;
    color: var(--text); cursor: pointer; transition: all .12s;
  }
  .choice:hover { border-color: var(--terra); }
  .choice.sel { background: var(--terra-bg); border-color: var(--terra); color: var(--terra-dark); font-weight: 500; }
  .progress-track { height: 4px; background: var(--cream-alt); border-radius: 4px; overflow: hidden; margin-bottom: 26px; }
  .progress-fill { height: 100%; background: var(--terra); border-radius: 4px; transition: width .3s; }
  ul.clean { list-style: none; margin: 14px 0; }
  ul.clean li { padding: 7px 0 7px 26px; position: relative; font-size: 15px; }
  ul.clean li:before { content: "\2713"; position: absolute; left: 0; color: var(--terra); font-weight: 600; }
  .divider { height: 1px; background: var(--line); margin: 22px 0; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; transition: color .2s; }
  .hint.met { color: var(--ok); }
  .note {
    background: var(--terra-bg); border-left: 3px solid var(--terra);
    border-radius: 4px; padding: 16px 18px; margin: 4px 0 4px;
  }
  .note .nt { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--terra-dark); margin-bottom: 6px; }
  .note p { font-size: 15px; color: var(--charcoal-soft); }
  .note ul { list-style: none; margin-top: 8px; }
  .note li { font-size: 15px; color: var(--ink); font-weight: 500; padding: 3px 0 3px 16px; position: relative; }
  .note li:before { content: "\2022"; position: absolute; left: 0; color: var(--terra); }
  .statbox { flex:1; background: var(--charcoal); border-radius: 6px; padding: 18px; }
  .statbox .n { font-size: 26px; font-weight: 600; color: #fff; }
  .statbox .l { font-size: 13px; color: #c9c6c0; }
  .cta-box {
    background: var(--charcoal); border-radius: 6px;
    padding: 26px 24px; margin-top: 26px;
  }
  .cta-box h2 { color: var(--cream); margin-bottom: 8px; }
  .cta-box p { color: #c9c6c0; font-size: 15px; margin-bottom: 18px; }
  .cta-box .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .cta-box .btn-ghost { color: var(--cream); border-color: var(--cream); }
  .cta-box .btn-ghost:hover { background: rgba(250,248,245,.08); }
  .linklike {
    background: none; border: none; font-family: inherit; font-size: 14px;
    color: var(--text-soft); text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 0;
  }
  .linklike:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
// ---------- Contact links ----------
const TEXT_NUMBER = "(844) 931-4624";
const TEXT_LINK = "sms:+18449314624";
const IG_HANDLE = "@ryankearneyofficial";
const IG_LINK   = "https://ig.me/m/ryankearneyofficial";

// ---------- GoHighLevel ----------
const GHL_WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/Xa2QtabaSXmZgaRRhf5C/webhook-trigger/0d5304d2-3442-4924-9f9c-c7e88536007c";

// ---------- Quiz definition ----------
const WHEEL_AREAS = ["Health","Relationships","Career","Finances","Personal growth","Fun","Environment","Contribution"];
const W_CHOICES = ["Where you work","When you work","What you work on","Who you work with"];

// Each item: type + timing. main/grace in seconds.
const QUESTIONS = [
  { id:"color", type:"open", label:"Warm-up",
    prompt:"What's your favorite color, and why do you think that's your favorite?",
    sub:"Don't overthink it. You can name a few colors if you need to, and if you're unsure, just say so.",
    minChars:10, main:60, grace:30 },
  { id:"where", type:"two-part", label:"Where you work",
    p1:"Where do you actually want to be when you're working?",
    p2:"And where are you working right now, honestly?",
    main:120, grace:60 },
  { id:"when", type:"two-part", label:"When you work",
    p1:"What hours and rhythm would your work follow if you designed them?",
    p2:"And whose schedule are you on right now, yours or someone else's?",
    main:120, grace:60 },
  { id:"what", type:"two-part", label:"What you work on",
    p1:"What would you spend your working hours doing if it were up to you?",
    p2:"And how much of your current work is that, versus things you'd hand off the second you could?",
    main:120, grace:60 },
  { id:"who", type:"two-part", label:"Who you work with",
    p1:"Who do you want around you day to day, the people you serve, build with, answer to?",
    p2:"And who's actually in that circle right now?",
    main:120, grace:60 },
  { id:"wheel", type:"wheel", label:"Your life wheel",
    prompt:"Rate each area of your life as it feels right now.", timed:false },
  { id:"strength", type:"two-part", label:"Your biggest strength",
    p1:"What's your single biggest strength, the one you could lean on to help with everything else?",
    p2:"And where in your life are you not using it yet?",
    main:120, grace:60 },
  { id:"ripple", type:"choice-why", label:"Biggest ripple effect",
    prompt:"Which area of your life, if you put your focus and energy into it right now, would create the biggest positive ripple effect across everything else?",
    choices: WHEEL_AREAS, why:"Why that one?", main:90, grace:30 },
  { id:"onew", type:"choice-why", label:"One W to change",
    prompt:"If you could take massive action and change one of these this month, which would have the greatest positive effect on your life?",
    choices: W_CHOICES, why:"Why that one?", main:90, grace:30 },
];

const TOTAL = QUESTIONS.length;
const MIN_CHARS = 40;
const answers = {};        // id -> answer data
const incompleteList = []; // ids the timer cut off under the minimum

let idx = 0;               // current question index
let timerHandle = null;
let secondsLeft = 0;
let inGrace = false;

const app = document.getElementById("app");

// ---------- Timer ----------
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

function startTimer(q, onCutoff){
  stopTimer();
  inGrace = false;
  secondsLeft = q.main;
  const el = document.getElementById("timer");
  const num = document.getElementById("timer-num");
  const warn = document.getElementById("warnmsg");
  if(num) num.textContent = fmt(secondsLeft);
  timerHandle = setInterval(()=>{
    secondsLeft--;
    if(secondsLeft <= 0 && !inGrace){
      // enter grace
      inGrace = true;
      secondsLeft = q.grace;
      if(el) el.classList.add("grace");
      if(warn) warn.classList.add("show");
    } else if(secondsLeft < 0 && inGrace){
      stopTimer();
      onCutoff();
      return;
    }
    if(num) num.textContent = fmt(Math.max(secondsLeft,0));
  }, 1000);
}

// ---------- Rendering ----------
let contactInfo = null;

function render(){
  if(idx >= TOTAL){
    if(!contactInfo){ renderContact(); } else { renderResults(); }
    return;
  }
  renderQuestion(QUESTIONS[idx], idx);
}

function topBar(q, remaining){
  const timed = q.timed !== false && (q.type==="two-part" || q.type==="choice-why" || q.type==="open");
  return `
    <div class="topbar">
      <span class="qcount">${remaining} ${remaining===1?"question":"questions"} left</span>
      ${timed ? `<span class="timer" id="timer"><span class="timer-dot"></span><span id="timer-num">${fmt(q.main)}</span></span>` : ``}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.round((idx/TOTAL)*100)}%"></div></div>
  `;
}

function renderQuestion(q, i){
  const remaining = TOTAL - i;
  let inner = "";

  if(q.type === "open"){
    inner = `
      <div class="part-label">${q.label}</div>
      <div class="warnmsg" id="warnmsg"><span>⏱</span> Time's up soon, wrap up your answer as fast as you can.</div>
      <div class="block">
        <div class="qtext">${q.prompt}</div>
        ${q.sub ? `<div class="qsub">${q.sub}</div>` : ``}
        <textarea id="a1" placeholder="Type your answer..."></textarea>
        <div class="hint" id="h1">Whatever comes to mind first</div>
      </div>
      <div class="footer-actions">
        <button class="btn" id="next" disabled>Next</button>
      </div>`;
  }
  else if(q.type === "two-part"){
    inner = `
      <div class="part-label">${q.label}</div>
      <div class="warnmsg" id="warnmsg"><span>⏱</span> Time's up soon, wrap up your answer as fast as you can.</div>
      <div class="block">
        <div class="qtext">${q.p1}</div>
        <textarea id="a1" placeholder="Type your answer..."></textarea>
        <div class="hint" id="h1">A sentence or two, please</div>
      </div>
      <div class="block">
        <div class="qtext">${q.p2}</div>
        <textarea id="a2" placeholder="Type your answer..."></textarea>
        <div class="hint" id="h2">A sentence or two, please</div>
      </div>
      <div class="footer-actions">
        <button class="btn" id="next" disabled>Next</button>
      </div>`;
  }
  else if(q.type === "wheel"){
    inner = `
      <div class="part-label">${q.label}</div>
      <h2 style="margin-bottom:16px;">${q.prompt}</h2>
      <div class="scale-def">
        <div><span class="scale-num">1</span> — this area feels stuck or unsatisfying</div>
        <div style="text-align:right;"><span class="scale-num">10</span> — you're thriving and fulfilled here</div>
      </div>
      ${WHEEL_AREAS.map((a,ai)=>`
        <div class="wheel-area">
          <div class="wheel-area-name">${a}</div>
          <div class="nums" data-area="${ai}">
            ${Array.from({length:10},(_,n)=>`<button class="num" data-val="${n+1}">${n+1}</button>`).join("")}
          </div>
        </div>`).join("")}
      <div class="footer-actions">
        <button class="btn" id="next" disabled>Next</button>
      </div>`;
  }
  else if(q.type === "choice-why"){
    inner = `
      <div class="part-label">${q.label}</div>
      <div class="warnmsg" id="warnmsg"><span>⏱</span> Time's up soon, wrap up your answer as fast as you can.</div>
      <h2 style="margin-bottom:16px;">${q.prompt}</h2>
      <div class="choices" id="choices">
        ${q.choices.map((c,ci)=>`<button class="choice" data-ci="${ci}">${c}</button>`).join("")}
      </div>
      <div class="block">
        <div class="qtext">${q.why}</div>
        <textarea id="why" placeholder="Type your answer..."></textarea>
        <div class="hint" id="hwhy">A sentence or two, please</div>
      </div>
      <div class="footer-actions">
        <button class="btn" id="next" disabled>Next</button>
      </div>`;
  }

  app.innerHTML = `<div class="card">${topBar(q, remaining)}${inner}</div>`;
  wireQuestion(q, ()=>advance(q));
}

function wireQuestion(q, advanceFn){
  const nextBtn = document.getElementById("next");

  if(q.type === "open"){
    const a1 = document.getElementById("a1");
    const h1 = document.getElementById("h1");
    const min = q.minChars || MIN_CHARS;
    const check = ()=>{
      const ok = a1.value.trim().length >= min;
      h1.classList.toggle("met", ok);
      h1.textContent = ok ? "Looks good" : "Whatever comes to mind first";
      nextBtn.disabled = !ok;
    };
    a1.addEventListener("input", check);
    startTimer(q, ()=>{ saveOpen(q, true); advanceFn(); });
    nextBtn.onclick = ()=>{ stopTimer(); saveOpen(q,false); advanceFn(); };
  }

  if(q.type === "two-part"){
    const a1 = document.getElementById("a1"), a2 = document.getElementById("a2");
    const h1 = document.getElementById("h1"), h2 = document.getElementById("h2");
    const check = ()=>{
      const ok1 = a1.value.trim().length >= MIN_CHARS;
      const ok2 = a2.value.trim().length >= MIN_CHARS;
      h1.classList.toggle("met", ok1);
      h2.classList.toggle("met", ok2);
      h1.textContent = ok1 ? "Looks good" : "A sentence or two, please";
      h2.textContent = ok2 ? "Looks good" : "A sentence or two, please";
      nextBtn.disabled = !(ok1 && ok2);
    };
    a1.addEventListener("input", check);
    a2.addEventListener("input", check);
    startTimer(q, ()=>{ // cutoff wins over the minimum
      saveTwoPart(q, true);
      advanceFn();
    });
    nextBtn.onclick = ()=>{ stopTimer(); saveTwoPart(q,false); advanceFn(); };
  }

  if(q.type === "wheel"){
    const picked = {};
    document.querySelectorAll(".nums").forEach(row=>{
      const ai = row.dataset.area;
      row.querySelectorAll(".num").forEach(btn=>{
        btn.onclick = ()=>{
          row.querySelectorAll(".num").forEach(b=>b.classList.remove("sel"));
          btn.classList.add("sel");
          picked[ai] = parseInt(btn.dataset.val);
          if(Object.keys(picked).length === WHEEL_AREAS.length){
            nextBtn.disabled = false;
          }
        };
      });
    });
    nextBtn.onclick = ()=>{
      const ratings = {};
      WHEEL_AREAS.forEach((a,i)=> ratings[a] = picked[i] || null);
      answers[q.id] = { ratings };
      advanceFn();
    };
  }

  if(q.type === "choice-why"){
    let choiceIdx = null;
    const why = document.getElementById("why");
    const hwhy = document.getElementById("hwhy");
    const check = ()=>{
      const okWhy = why.value.trim().length >= MIN_CHARS;
      hwhy.classList.toggle("met", okWhy);
      hwhy.textContent = okWhy ? "Looks good" : "A sentence or two, please";
      nextBtn.disabled = !(choiceIdx!==null && okWhy);
    };
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.onclick = ()=>{
        document.querySelectorAll(".choice").forEach(b=>b.classList.remove("sel"));
        btn.classList.add("sel");
        choiceIdx = parseInt(btn.dataset.ci);
        check();
      };
    });
    why.addEventListener("input", check);
    startTimer(q, ()=>{ saveChoiceWhy(q, choiceIdx, true); advanceFn(); });
    nextBtn.onclick = ()=>{
      if(choiceIdx===null) return;
      stopTimer(); saveChoiceWhy(q, choiceIdx, false); advanceFn();
    };
  }
}

function saveOpen(q, cutoff){
  const a1 = (document.getElementById("a1")||{}).value || "";
  answers[q.id] = { text: a1 };
  const min = q.minChars || MIN_CHARS;
  if(cutoff && a1.trim().length < min) flagIncomplete(q.id);
}

function saveTwoPart(q, cutoff){
  const a1 = (document.getElementById("a1")||{}).value || "";
  const a2 = (document.getElementById("a2")||{}).value || "";
  answers[q.id] = { p1:a1, p2:a2 };
  const incomplete = a1.trim().length < MIN_CHARS || a2.trim().length < MIN_CHARS;
  if(cutoff && incomplete) flagIncomplete(q.id);
}

function saveChoiceWhy(q, choiceIdx, cutoff){
  const why = (document.getElementById("why")||{}).value || "";
  answers[q.id] = { choice: choiceIdx!==null ? q.choices[choiceIdx] : null, why };
  if(cutoff && (choiceIdx===null || why.trim().length < MIN_CHARS)) flagIncomplete(q.id);
}

function flagIncomplete(id){ if(!incompleteList.includes(id)) incompleteList.push(id); }

function advance(q){ idx++; render(); }

// ---------- Plain-text summary for copy / text / DM ----------
function buildSummaryText(){
  const lines = ["MY LIFESTYLE AUDIT RESULTS", ""];
  const color = answers.color || {};
  if(color.text) lines.push("Favorite color: " + color.text.trim(), "");
  const wheel = answers.wheel ? answers.wheel.ratings : null;
  if(wheel){
    lines.push("Life wheel:");
    Object.keys(wheel).forEach(a=> lines.push("  " + a + ": " + (wheel[a] ?? "-") + "/10"));
    lines.push("");
  }
  QUESTIONS.filter(q=>q.type==="two-part").forEach(q=>{
    const a = answers[q.id];
    if(!a) return;
    lines.push(q.label + ":");
    lines.push("  Want: " + (a.p1||"").trim());
    lines.push("  Now: " + (a.p2||"").trim());
    lines.push("");
  });
  const ripple = answers.ripple || {};
  const onew = answers.onew || {};
  if(ripple.choice || ripple.why) lines.push("Biggest ripple effect: " + (ripple.choice||"-") + (ripple.why?" - "+ripple.why.trim():""), "");
  if(onew.choice || onew.why) lines.push("One W to change this month: " + (onew.choice||"-") + (onew.why?" - "+onew.why.trim():""), "");
  if(incompleteList.length){
    const labels = incompleteList.map(id => (QUESTIONS.find(x=>x.id===id)||{}).label).filter(Boolean);
    lines.push("Ran out of time on: " + labels.join(", "));
  }
  if(actionItems){
    lines.push("", buildActionsText());
  }
  return lines.join("\n").trim();
}

// ---------- Contact step ----------
function renderContact(){
  stopTimer();
  app.innerHTML = `
    <div class="card">
      <div class="topbar">
        <span class="qcount">Last step</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:96%"></div></div>
      <div class="part-label">Almost there</div>
      <h1 style="font-size:28px; margin-bottom:12px;">Where should the honest feedback go?</h1>
      <p class="muted" style="margin-bottom:22px;">Your answers get saved with your info so when you drop in, Ryan already has your data in front of him. No newsletter ambush, no drip sequence.</p>
      <div class="field">
        <label for="c-name">First name</label>
        <input id="c-name" type="text" autocomplete="given-name" placeholder="Your first name">
      </div>
      <div class="field">
        <label for="c-email">Email</label>
        <input id="c-email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="c-phone">Phone</label>
        <input id="c-phone" type="tel" autocomplete="tel" placeholder="(555) 555-5555">
      </div>
      <div class="hint" id="c-hint" style="margin-bottom:14px;"></div>
      <div class="footer-actions">
        <button class="btn" id="c-next" disabled>See my results</button>
      </div>
    </div>`;
  const name = document.getElementById("c-name");
  const email = document.getElementById("c-email");
  const phone = document.getElementById("c-phone");
  const btn = document.getElementById("c-next");
  const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
  const validPhone = v => v.replace(/\D/g,"").length >= 10;
  const check = ()=>{
    btn.disabled = !(name.value.trim().length >= 2 && validEmail(email.value) && validPhone(phone.value));
  };
  [name,email,phone].forEach(el=> el.addEventListener("input", check));
  btn.onclick = ()=>{
    contactInfo = {
      first_name: name.value.trim(),
      email: email.value.trim(),
      phone: phone.value.trim()
    };
    btn.disabled = true;
    btn.textContent = "One second...";
    sendToGHL().finally(()=> renderResults());
  };
}

// ---------- Send to GoHighLevel ----------
function postToGHL(resultsText, submissionType){
  if(!GHL_WEBHOOK_URL) return Promise.resolve();
  const payload = {
    source: "Lifestyle Audit Quiz",
    submission_type: submissionType,
    lifestyle_audit_completed: true,
    completed_at: new Date().toISOString(),
    first_name: contactInfo.first_name,
    email: contactInfo.email,
    phone: contactInfo.phone,
    results_text: resultsText,
    ran_out_of_time_on: incompleteList.map(id => (QUESTIONS.find(x=>x.id===id)||{}).label).filter(Boolean).join(", "),
    answers_json: JSON.stringify(answers)
  };
  return fetch(GHL_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(()=>{ /* never block the user's results on a network hiccup */ });
}

function sendToGHL(){
  return postToGHL(buildSummaryText(), "audit_results");
}

// ---------- Strength vs weakness helpers ----------
function lowestWheelAreas(n){
  const wheel = answers.wheel ? answers.wheel.ratings : null;
  if(!wheel) return [];
  return Object.entries(wheel)
    .filter(([,v])=> v !== null && v !== undefined)
    .sort((a,b)=> a[1]-b[1])
    .slice(0, n)
    .map(([area, score])=> ({area, score}));
}

let actionItems = null; // {today, week, month} once locked in

function buildActionsText(){
  if(!actionItems) return "";
  return [
    "MY THREE MOVES (Lifestyle Audit)",
    "",
    "Starting today: " + actionItems.today,
    "Starting a week from now: " + actionItems.week,
    "Starting this month: " + actionItems.month
  ].join("\n");
}

// ---------- Leverage section (strengths vs weaknesses + three moves) ----------
function renderLeverageHTML(){
  const strength = answers.strength || {};
  const lows = lowestWheelAreas(2);
  const strengthLine = strength.p1
    ? `<p class="small" style="margin-bottom:10px;">You said your biggest strength is:</p>
       <div class="note" style="margin-bottom:14px;"><p>"${strength.p1.trim()}"</p></div>`
    : `<p class="small muted" style="margin-bottom:14px;">You didn't finish the strength question, so start there: what's the one thing you're best at?</p>`;
  const lowsLine = lows.length
    ? `<p class="small" style="margin-bottom:10px;">And the areas of your life that scored lowest:</p>
       <ul class="clean" style="margin-top:0;">${lows.map(l=>`<li>${l.area}: <strong>${l.score}</strong> / 10</li>`).join("")}</ul>`
    : ``;
  const unusedLine = strength.p2
    ? `<p class="small muted" style="margin-bottom:14px;">Worth noticing: you also said you're not using that strength here yet. "${strength.p2.trim()}"</p>`
    : ``;
  return `
      <div class="divider"></div>
      <div class="part-label">Your next step</div>
      <h2 style="margin-bottom:14px;">Use what's strong to fix what's stuck.</h2>
      ${strengthLine}
      ${lowsLine}
      ${unusedLine}
      <p class="small" style="margin-bottom:18px;">So here's the real question: <strong>how do you leverage that strength against those weak spots?</strong> Write three moves. Be specific.</p>
      <div class="block" style="margin-bottom:18px;">
        <div class="qtext" style="font-size:16px;">1. Something you can start doing today</div>
        <textarea id="act-today" style="min-height:64px;" placeholder="Type your move..."></textarea>
      </div>
      <div class="block" style="margin-bottom:18px;">
        <div class="qtext" style="font-size:16px;">2. Something you can start doing a week from now</div>
        <textarea id="act-week" style="min-height:64px;" placeholder="Type your move..."></textarea>
      </div>
      <div class="block" style="margin-bottom:14px;">
        <div class="qtext" style="font-size:16px;">3. Something you can start doing this month</div>
        <textarea id="act-month" style="min-height:64px;" placeholder="Type your move..."></textarea>
      </div>
      <div class="footer-actions" style="justify-content:flex-start;">
        <button class="btn" id="lockbtn" disabled>Lock in my three moves</button>
      </div>`;
}

function wireLeverage(){
  const t = document.getElementById("act-today");
  const w = document.getElementById("act-week");
  const m = document.getElementById("act-month");
  const btn = document.getElementById("lockbtn");
  if(!t || !w || !m || !btn) return;
  const MIN = 10;
  const check = ()=>{
    btn.disabled = !(t.value.trim().length>=MIN && w.value.trim().length>=MIN && m.value.trim().length>=MIN);
  };
  [t,w,m].forEach(el=> el.addEventListener("input", check));
  btn.onclick = ()=>{
    actionItems = { today: t.value.trim(), week: w.value.trim(), month: m.value.trim() };
    [t,w,m].forEach(el=> el.disabled = true);
    btn.disabled = true;
    btn.textContent = "Locked in ✓";
    const cta = document.getElementById("cta-copy");
    if(cta) cta.textContent = "Now copy everything and send it over. Ryan reads these himself and he'll connect with you on your three moves.";
    postToGHL(buildActionsText(), "action_items");
  };
}

// ---------- Results ----------
function renderResults(){
  stopTimer();
  const wheel = answers.wheel ? answers.wheel.ratings : {};
  const rows = Object.keys(wheel).map(a=>`<li>${a}: <strong>${wheel[a]??"—"}</strong> / 10</li>`).join("");
  const ripple = answers.ripple || {};
  const onew = answers.onew || {};
  const color = answers.color || {};
  const incompleteLabels = incompleteList.map(id => (QUESTIONS.find(x=>x.id===id)||{}).label).filter(Boolean);
  const noteBlock = incompleteLabels.length ? `
      <div class="divider"></div>
      <div class="note">
        <div class="nt">Worth noticing</div>
        <p>You ran out of time before fully answering ${incompleteLabels.length===1?"this one":"these"}. That's worth paying attention to, the questions we stall on are often the ones that matter most.</p>
        <ul>${incompleteLabels.map(l=>`<li>${l}</li>`).join("")}</ul>
      </div>` : "";
  app.innerHTML = `
    <div class="card">
      <div class="part-label done">Done</div>
      <h1 style="margin-bottom:10px;">That's your audit.</h1>
      <p class="muted">Here's a snapshot of what you told me.</p>
      ${color.text ? `
      <div class="divider"></div>
      <h2 style="font-size:17px; margin-bottom:8px;">Warm-up</h2>
      <p class="small muted">Favorite color: <strong>${color.text}</strong></p>` : ``}
      <div class="divider"></div>
      <h2 style="font-size:17px; margin-bottom:8px;">Your life wheel</h2>
      <ul class="clean">${rows||"<li>Not completed</li>"}</ul>
      <div class="divider"></div>
      <h2 style="font-size:17px; margin-bottom:8px;">Where you'd focus first</h2>
      <p class="small muted">Biggest ripple effect: <strong>${ripple.choice||"—"}</strong>${ripple.why?` — "${ripple.why}"`:""}</p>
      <p class="small muted" style="margin-top:6px;">One W to change this month: <strong>${onew.choice||"—"}</strong>${onew.why?` — "${onew.why}"`:""}</p>
      ${noteBlock}
      ${renderLeverageHTML()}
      <div class="cta-box">
        <div class="part-label" style="color:#c9c6c0;">Next step</div>
        <h2>Text or DM Ryan the results to drop in and go over your data.</h2>
        <p id="cta-copy">Write your three moves above, then copy everything and send it over. Ryan reads these himself and he'll connect with you.</p>
        <div class="btns">
          <button class="btn" id="copybtn">Copy my results</button>
          <a class="btn btn-ghost" href="${TEXT_LINK}">Text ${TEXT_NUMBER} <span class="arr">→</span></a>
          <a class="btn btn-ghost" href="${IG_LINK}" target="_blank" rel="noopener">DM ${IG_HANDLE} <span class="arr">→</span></a>
        </div>
      </div>
      <div class="footer-actions" style="margin-top:22px; justify-content:center;">
        <button class="linklike" id="restart">Take it again</button>
      </div>
    </div>`;
  document.getElementById("restart").onclick = ()=> location.reload();
  wireLeverage();
  const copyBtn = document.getElementById("copybtn");
  copyBtn.onclick = ()=>{
    const txt = buildSummaryText();
    const done = ()=>{ copyBtn.textContent = "Copied ✓"; setTimeout(()=>copyBtn.textContent="Copy my results", 2500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
    } else {
      fallbackCopy(txt, done);
    }
  };
}

function fallbackCopy(txt, done){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){}
  document.body.removeChild(ta);
}

  app.innerHTML = `
    <div class="card">
      <div class="part-label">Lifestyle Audit</div>
      <h1 style="margin-bottom:14px;">An honest look at the life you're actually living.</h1>
      <p class="muted" style="margin-bottom:20px;">This isn't a personality test and there are no right answers. It's a mirror. The more honest you are, the more useful it is.</p>
      <div style="display:flex; gap:12px; margin-bottom:24px;">
        <div class="statbox">
          <div class="n">${TOTAL}</div>
          <div class="l">questions</div>
        </div>
        <div class="statbox">

          <div class="l">for most people</div>

renderIntro();
